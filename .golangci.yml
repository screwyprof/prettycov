# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
    # Keep in sync with the golines formatter below: same budget, same tab cost,
    # so `golangci-lint fmt` actually fixes what lll reports.
    lll:
      line-length: 120
      tab-width: 4
    nolintlint:
      allow-unused: true
    wrapcheck:
      # Substrings of signatures to ignore; overrides wrapcheck's default set.
      # See https://github.com/tomarrell/wrapcheck#configuration
      ignore-sigs:
        - fmt.Errorf(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude some linters from running on test files.
      - linters:
          - dupl
          - funlen
          - gosec
        path: _test\.go
      - linters:
          - dupl
          - funlen
          - gosec
        path: test_helpers\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # Show only new issues created after git revision `REV`.
  new-from-rev: main
formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/screwyprof/prettycov)
    golines:
      max-len: 120
      tab-len: 4
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
