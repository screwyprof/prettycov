# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  # main_test.go is behind //go:build integration; without this the linters never see it.
  build-tags:
    - integration
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bidichk
    - asciicheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupword
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errname
    - errorlint
    - exptostd
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - godoclint
    - goprintffuncname
    - gosec
    - govet
    - iface
    - importas
    - intrange
    - ineffassign
    - lll
    - makezero
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - recvcheck
    - staticcheck
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - unused
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    # The layering, enforced rather than reviewed. prettycov is the domain: it must not learn what a
    # command line is, and it must not depend on a front end. internal/cli is one front end; the
    # composition root is the only place that knows both, and cmd is the only thing that starts it.
    #
    # Tests are exempt: the end-to-end ones drive app.Run on purpose, which is the point of them.
    depguard:
      rules:
        domain:
          files:
            - "**/*.go"
            - "!**/internal/**"
            - "!**/cmd/**"
            - "!$test"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: the domain does not know about the command line
            - pkg: github.com/screwyprof/prettycov/internal
              desc: the domain does not depend on a front end
        handlers:
          files:
            - "**/internal/cli/*.go"
            - "!$test"
          deny:
            - pkg: github.com/screwyprof/prettycov/internal/app
              desc: the composition root wires the handlers, not the other way round
    goconst:
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 10
    # require-doc is the rule revive's `exported` would have been: the exclusions below suppress
    # that preset wholesale, so nothing was checking that an exported symbol has a comment at all.
    # max-len stays off; it wants 77 and this repo wraps at 120.
    godoclint:
      enable:
        - require-doc
        - require-pkg-doc
        - require-stdlib-doclink
        - no-unused-link
    govet:
      enable:
        - shadow
    # argument-limit is the reason this block exists: a function taking five things is usually two
    # of them that belong together, which is how a pair of parallel slices travelled through four
    # signatures here. Four is the bar because three real ones sit there and earn it — append takes
    # its destination first, and walk's level, parent and padding are recursion state.
    #
    # The rest of the list is revive's own default set, written out because naming any rule replaces
    # the defaults rather than adding to them. Without it, adding argument-limit would silently turn
    # off var-naming and the twenty-two beside it, which is a gate quietly doing less.
    revive:
      rules:
        - name: argument-limit
          arguments: [4]
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    # Keep in sync with the golines formatter below: same budget, same tab cost,
    # so `golangci-lint fmt` actually fixes what lll reports.
    lll:
      line-length: 120
      tab-width: 4
    nolintlint:
      allow-unused: true
    wrapcheck:
      # Substrings of signatures to ignore; overrides wrapcheck's default set.
      # See https://github.com/tomarrell/wrapcheck#configuration
      ignore-sigs:
        - fmt.Errorf(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude some linters from running on test files. goconst among them: a path repeated
      # across two table cases is a fixture, not a constant waiting to be named.
      - linters:
          - dupl
          - funlen
          - goconst
          - gosec
        path: _test\.go
issues:
  # Only what this branch added, measured against where it left main.
  #
  # origin/main, not main: a CI checkout has no local branch of that name, only remote-tracking
  # refs, so revgrep failed with `fatal: bad revision 'main'` and golangci-lint fell back to
  # reporting everything. It warned rather than failed, and the repository lints clean, so the
  # annotation step has been unfiltered for as long as it has existed without anything to show for
  # it. `make lint-all` passes --new-from-rev="" and is the gate, so this never affected `make
  # check`.
  #
  # merge-base rather than the tip: against the tip, anything landing on main after the branch
  # started reads as this branch's work.
  new-from-merge-base: origin/main
formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/screwyprof/prettycov)
    golines:
      max-len: 120
      tab-len: 4
  exclusions:
    generated: lax
