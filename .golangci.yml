# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  # main_test.go is behind //go:build integration; without this the linters never see it.
  build-tags:
    - integration
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupword
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errname
    - errorlint
    - exptostd
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - godoclint
    - goprintffuncname
    - gosec
    - govet
    - iface
    - importas
    - intrange
    - ineffassign
    - lll
    - makezero
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilaway
    - nilerr
    - nilnesserr
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - unused
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    # nilaway is a module plugin, so it needs the binary .custom-gcl.yml builds. `make lint` builds
    # it on demand; plain `golangci-lint` will refuse the config, which is the point — it says so
    # rather than silently skipping the analysis.
    #
    # Production only: nilaway traces nil through a whole package, and a test that slices the empty
    # slice an assertion just built is a true observation about code that cannot ship. Eight of the
    # eleven it first reported here were that.
    custom:
      nilaway:
        type: module
        description: Detects potential nil panics.
        settings:
          include-pkgs: github.com/screwyprof/prettycov
          exclude-test-files: "true"
    # The layering, enforced rather than reviewed. prettycov is the domain: it must not learn what a
    # command line is, and it must not depend on a front end. internal/cli is one front end; the
    # composition root is the only place that knows both, and cmd is the only thing that starts it.
    #
    # Tests are exempt: the end-to-end ones drive app.Run on purpose, which is the point of them.
    depguard:
      rules:
        domain:
          files:
            - "**/*.go"
            - "!**/internal/**"
            - "!**/cmd/**"
            - "!$test"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: the domain does not know about the command line
            - pkg: github.com/screwyprof/prettycov/internal
              desc: the domain does not depend on a front end
        handlers:
          files:
            - "**/internal/cli/*.go"
            - "!$test"
          deny:
            - pkg: github.com/screwyprof/prettycov/internal/app
              desc: the composition root wires the handlers, not the other way round
    goconst:
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
    # Keep in sync with the golines formatter below: same budget, same tab cost,
    # so `golangci-lint fmt` actually fixes what lll reports.
    lll:
      line-length: 120
      tab-width: 4
    nolintlint:
      allow-unused: true
    wrapcheck:
      # Substrings of signatures to ignore; overrides wrapcheck's default set.
      # See https://github.com/tomarrell/wrapcheck#configuration
      ignore-sigs:
        - fmt.Errorf(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude some linters from running on test files. goconst among them: a path repeated
      # across two table cases is a fixture, not a constant waiting to be named.
      - linters:
          - dupl
          - funlen
          - goconst
          - gosec
        path: _test\.go
      - linters:
          - dupl
          - funlen
          - gosec
        path: test_helpers\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # Show only new issues created after git revision `REV`.
  new-from-rev: main
formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/screwyprof/prettycov)
    golines:
      max-len: 120
      tab-len: 4
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
