name: Go

# Pull requests cover branches; push covers main. Listing both unscoped ran everything twice —
# pushing to a branch with an open PR fires `push` for the branch ref AND `pull_request`
# (synchronize) for the moved head, so every commit built the same SHA in two identical runs.
on:
  push:
    branches: [main]
  pull_request:

# This repo predates GitHub's 2023 switch to a read-only default, so GITHUB_TOKEN would otherwise
# resolve to Contents/Actions/Deployments: write and be handed to every third-party action in the
# job. Nothing here needs to write to the repo; the lint job re-adds only checks: write, which
# reviewdog's github-pr-check reporter requires.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout MUST precede setup-go: go-version-file reads go.mod off the working tree.
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single-sourced from go.mod (currently 1.26) so CI can never drift from the module again.
          # 1.26 rather than 1.27 on purpose: golang/go#80974 makes 1.27 miscount statements, which
          # a coverage tool cannot ship on. See .modernize for the condition to lift it.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build App
        run: make build

      # go.mod and go.sum are checked in, so a PR that leaves them stale is a PR that builds here
      # and not on the next machine. The pre-commit hook catches it locally; this catches the rest.
      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          # .golangci.yml sets `new-from-rev: main`, which needs real history to diff against.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.github_token }}
          golangci_lint_version: v2.13.2

      # reviewdog reports the diff, which .golangci.yml's new-from-rev narrows it to. That is what
      # keeps a contributor from drowning in what was already there — and it is also why a function
      # already over a budget can be added to without a word: the lines are new, the issue is not.
      # newFlagSet grew from 78 to 80 lines against a funlen of 60 that way. This runs the whole
      # repository so the standing state has to stay clean too.
      - name: golangci-lint, whole repository
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          # setup-go above already restored the module cache; letting this restore its own on top
          # unpacks the same files over themselves and tar fails the step.
          skip-cache: true
          args: --new-from-rev=""

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test

      # Dogfooding: the tool's report on its own profile, written to the run summary so it is
      # visible without opening the log. Reuses the coverage.out `make test` just wrote.
      - name: Coverage tree
        run: |
          {
            echo '### Coverage'
            echo '```'
            make test-cover-tree
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          fail_ci_if_error: true # optional (default = false)
          verbose: false # optional (default = false)

  # The four gates `make check` runs that nothing above does. They are the repository's actual
  # quality claim — 100% mutation efficacy, every condition covered, no reachable vulnerability, no
  # prose finding — and until now they were enforced on a developer's machine and nowhere else.
  #
  # 31 seconds warm, all four. The tools compile on the first run because the Makefile fetches them
  # with `go run pkg@version` rather than requiring an install; setup-go's cache keeps that to once.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Reachability-aware, so unlike a generic dependency scan it reports only what this binary
      # can actually reach.
      - name: Vulnerabilities
        run: make vulns

      # Vale over the Markdown, against Google's developer documentation style guide. .vale.ini
      # records what this project declines and why.
      - name: Prose
        run: make docs-lint

      # Go measures statements, so `return a && b` is covered the moment it runs either way. gobco
      # instruments the conditions and says which were never true or never false.
      - name: Condition coverage
        run: make cover-branches

      # A surviving mutant is a test that runs a line without asserting on it, which statement
      # coverage cannot see and this repository holds at zero.
      - name: Mutation testing
        run: make mutate
