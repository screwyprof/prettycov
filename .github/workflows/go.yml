name: Go

# Pull requests cover branches; push covers main. Listing both unscoped ran everything twice —
# pushing to a branch with an open PR fires `push` for the branch ref AND `pull_request`
# (synchronize) for the moved head, so every commit built the same SHA in two identical runs.
on:
  push:
    branches: [main]
  pull_request:

# Set explicitly: this repo predates GitHub's read-only default, so the token would otherwise carry
# Contents/Actions/Deployments: write into every action in the job.
permissions:
  contents: read

jobs:
  # One job running one command, because two lists of gates drift: this ran three while `make check`
  # ran seven, so four gates were enforced on a developer's machine and nowhere else.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # github-pr-check, the reporter the annotation step uses.
      checks: write
    steps:
      # Checkout MUST precede setup-go: cache-dependency-path reads go.sum off the working tree.
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          # .golangci.yml diffs against origin/main, which needs real history, and
          # `make cover-branches` copies what git tracks.
          fetch-depth: 0
          # Nothing here pushes, so the token does not belong in .git/config where `make check`
          # can read it — and `make check` runs bumped dependency code.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 1.26 rather than 1.27 on purpose: golang/go#80974 makes 1.27 miscount statements, which
          # is the one bug a coverage tool cannot ship on. CL 819000 fixed it for 1.28 with no 1.27
          # backport, so this lifts when 1.28 ships and not before.
          #
          # `.x`, not go-version-file: setup-go reads go.mod's minimum as an exact patch and sets
          # GOTOOLCHAIN=local, so CI sat on 1.26.0 and shipped GO-2026-4601 through a green
          # govulncheck. The minor stays pinned; only the patch floats.
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      # Annotations on the diff, which a log cannot give. Never a gate — `make check` below runs the
      # same linter for real — so it is skipped where it cannot work and never fails the job:
      # a fork's token is read-only and reviewdog 403s, and a Renovate run is fully trusted, which
      # would hand a freshly bumped golangci-lint the token in this step's env.
      - name: Lint annotations
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'renovate[bot]'
        continue-on-error: true
        run: make lint-annotate
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `shell: bash` is load-bearing: it means `bash -eo pipefail`, where the default for `run` on
      # Linux is `bash -e` with no pipefail. Without it the step exits with tee's status, which is
      # always 0, and `make check` cannot fail CI at all — the Makefile's own pipefail governs the
      # pipes inside its recipes, not the one this wraps around it.
      - name: make check
        shell: bash
        run: make check | tee check.out

      # Guarded cat: under always() this also runs when a step before `make check` failed, and then
      # check.out was never written.
      - name: Publish the gate block
        if: always()
        run: |
          {
            echo '### Gates'
            echo '```'
            cat check.out 2>/dev/null || echo '(make check did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage tree
        run: |
          {
            echo '### Coverage'
            echo '```'
            make test-cover-tree
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The one gate that cannot live in the Makefile: it compares against the base commit.
      # codecov/* are required checks: a skipped upload leaves them pending forever.
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.out') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          # Named, not searched for: left to search it also uploaded testdata/delegator.coverage.out,
          # a fixture profile of a different repository that this tool's own tests read.
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: true
          verbose: false
