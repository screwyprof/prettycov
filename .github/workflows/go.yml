name: Go

# Pull requests cover branches; push covers main. Listing both unscoped ran everything twice —
# pushing to a branch with an open PR fires `push` for the branch ref AND `pull_request`
# (synchronize) for the moved head, so every commit built the same SHA in two identical runs.
on:
  push:
    branches: [main]
  pull_request:

# This repo predates GitHub's 2023 switch to a read-only default, so GITHUB_TOKEN would otherwise
# resolve to Contents/Actions/Deployments: write and be handed to every third-party action in the
# job. Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  # One job running one command, because two lists of gates drift and this pair had: CI ran build,
  # lint and test while `make check` ran seven, so mutation testing, condition coverage,
  # govulncheck and the prose gate were enforced on a developer's machine and nowhere else. The
  # reverse happened too — a `go mod tidy` check lived here and not in the Makefile.
  #
  # Worse, the lint CI ran was not the lint the Makefile runs. `make lint-all` uses a golangci-lint
  # with nilaway compiled in as a module plugin; the actions downloaded the stock binary, which
  # cannot load that config at all:
  #
  #   Error: build linters: plugin(nilaway): plugin "nilaway" not found
  #
  # `make check` builds the custom binary itself, so the linter here is the linter a contributor
  # ran before pushing.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # github-pr-check, the reporter the annotation step uses.
      checks: write
    steps:
      # Checkout MUST precede setup-go: go-version-file reads go.mod off the working tree.
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          # .golangci.yml sets `new-from-rev: main`, which needs real history to diff against, and
          # `make cover-branches` copies what git tracks.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single-sourced from go.mod (currently 1.26) so CI can never drift from the module.
          # 1.26 rather than 1.27 on purpose: golang/go#80974 makes 1.27 miscount statements, which
          # is the one bug a coverage tool cannot ship on. CL 819000 fixed it for 1.28 with no 1.27
          # backport, so this lifts when 1.28 ships and not before.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Before the gate, so findings reach the diff as annotations even though `make check` is
      # about to fail on them. `-fail-level=any` makes this a gate in its own right; the step below
      # runs the same linter again as part of the whole suite.
      #
      # Same-repo branches only. A fork's pull_request run gets a read-only GITHUB_TOKEN whatever
      # this job asks for, so reviewdog's github-pr-check reporter 403s — and with -fail-level=any
      # and no continue-on-error that failed the job before `make check` ever ran, showing an
      # outside contributor a permissions error instead of a lint result. Skipping is the whole fix:
      # the same linter runs inside `make check` on the next step, so nothing goes unchecked, it
      # just lands in the log rather than on the diff.
      - name: Lint annotations
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: make lint-annotate
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every gate, in one command, and the same command CONTRIBUTING tells a contributor to run.
      # The tools it needs are fetched with `go run pkg@version` rather than installed, so nothing
      # here has to be kept in step with the Makefile's versions either.
      # `shell: bash` is load-bearing: it means `bash -eo pipefail`, where the default for `run` on
      # Linux is `bash -e` with no pipefail. Without it the step exits with tee's status, which is
      # always 0, and `make check` cannot fail CI at all — the Makefile's own pipefail governs the
      # pipes inside its recipes, not the one this wraps around it.
      - name: make check
        shell: bash
        run: make check | tee check.out

      # The block `make check` prints is the one a pull request description wants, so put it where
      # it can be copied without opening the log.
      - name: Publish the gate block
        if: always()
        run: |
          {
            echo '### Gates'
            echo '```'
            cat check.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Dogfooding: the tool's own report on its own profile, from the coverage.out `make check`
      # already wrote.
      - name: Coverage tree
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            make test-cover-tree
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Codecov is the one gate that cannot live in the Makefile: it compares against the base
      # commit, which needs the service. codecov.yml's project target and COVERAGE_FLOOR in the
      # Makefile are the same number, said in the two places that enforce it.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          fail_ci_if_error: true
          verbose: false
