name: Go
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout MUST precede setup-go: go-version-file reads go.mod off the working tree.
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single-sourced from go.mod (currently 1.27) so CI can never drift from the module again.
          go-version-file: go.mod
          # On by default in v4+, but stated explicitly: the test job's `make deps` compiles four
          # tools from source, so the module + build cache is worth more here than the default implies.
          cache: true
          cache-dependency-path: go.sum

      - name: Build App
        run: make build

  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          # .golangci.yml sets `new-from-rev: main`, which needs real history to diff against.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.github_token }}
          golangci_lint_version: v2.13.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: |
          make deps
          make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          fail_ci_if_error: true # optional (default = false)
          verbose: false # optional (default = false)
