name: Vulnerabilities

# An advisory lands whether or not anyone pushes, and Go's triggers do not: `Go` runs on push and
# pull_request only, so an idle repository learns about a CVE on its next commit.
#
# Ceiling: GitHub disables a schedule after 60 days without repository activity — the same idleness
# this exists for. Re-enable from the notification; nothing here can detect it stopped.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulns:
    runs-on: ubuntu-latest
    # Both lines users build on: 1.26 from go.mod's go line, 1.27 from the toolchain floor.
    strategy:
      # One line's advisory must not cancel the other's scan.
      fail-fast: false
      matrix:
        go: ['1.26.x', '~1.27.2']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          # CONTRIBUTING lists where the floor is set.
          go-version: ${{ matrix.go }}
          # Users take the newest patch, so scan that, not whatever the runner has cached.
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      # local, or the toolchain line switches 1.26 to 1.27.2 and the scan reads the wrong stdlib.
      - run: make vulns
        env:
          GOTOOLCHAIN: local
