# Dependabot reads go.mod and .github/workflows/ — and nothing else. The six *_VERSION pins in the
# Makefile and the nixpkgs input in flake.nix are invisible to it and stay hand-bumped; Renovate is
# the bot that can read those two, if that ever becomes worth a second bot.
#
# One caveat that has no gate behind it: flake.nix's vendorHash pins the whole module set, and it is
# kept in step by a pre-commit hook that needs nix locally. Dependabot does not run that hook, so a
# gomod PR lands with a stale hash and `nix build` breaks until someone runs `make nix-hash`.
# `make check` does not catch it, because CI has no nix. Run `make nix-hash` on a gomod PR before
# merging it.
version: 2

updates:
  # Five direct requirements, so an ungrouped config would be five PRs for one afternoon of x/
  # tagging. Minor and patch land together; a major gets its own PR, which is the one that deserves
  # to be read.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  # Three actions today. Worth automating anyway: a tag is mutable, so "up to date" here means
  # someone re-read the tag, and nobody was doing that.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
