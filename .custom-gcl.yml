# A golangci-lint built with nilaway compiled in, so nil analysis is part of `lint` rather than a
# target of its own. `make lint` builds this on demand and uses it.
# renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
version: v2.13.1
name: golangci-lint-prettycov
destination: ./bin
plugins:
  - module: go.uber.org/nilaway
    # The plugin entrypoint, not the module root: the root has no golangci registration, and
    # without this the binary compiles nilaway in and then reports "plugin not found".
    import: go.uber.org/nilaway/cmd/gclplugin
    # Pinned, like the tool versions in the Makefile and for the same reason: `latest` turns CI red
    # on an upstream release with no commit here, and because $(GCL) is a file rule keyed on this
    # file's mtime, a cached binary keeps an older nilaway than a fresh CI build — two linters
    # disagreeing with nothing to catch it.
    #
    # nilaway publishes no tags, so this is the pseudo-version the proxy answers with.
    # renovate: datasource=go depName=go.uber.org/nilaway
    version: v0.0.0-20260915140140-59aa42bdc591
