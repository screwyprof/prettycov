# Hooks shell out to the Makefile rather than pinning tools themselves. Nix users get the binaries
# from the devShell, everyone else from `make deps` (GOBIN) — so one config serves both, and tool
# versions stay single-sourced in go.mod's `tool` block instead of being duplicated here.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: gofumpt + gci
        entry: make fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-lint
        name: golangci-lint
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: (^go\.mod$|^go\.sum$|\.go$)
        pass_filenames: false

      # Keeps flake.nix's vendorHash in step with the module set automatically. No-op without nix,
      # so non-nix users are never blocked by a hook they can't satisfy.
      - id: nix-vendor-hash
        name: nix vendorHash
        entry: bash -c 'command -v nix >/dev/null 2>&1 || exit 0; make nix-hash'
        language: system
        files: ^(go\.mod|go\.sum)$
        pass_filenames: false
