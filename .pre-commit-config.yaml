# Hooks shell out to the Makefile rather than pinning tools themselves, so one config serves nix
# and non-nix users alike and no tool version is duplicated here.
#
# Formatting and linting both go through golangci-lint, which is NOT a go.mod tool — see the note
# on require-golangci in the Makefile. That target carries the "not found" message for both, which
# is why these two hooks are bare `make` calls: the guard lives in one place, not in yaml.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: format
        entry: make fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      # Fails rather than skips when golangci-lint is absent: contributors are expected to lint,
      # and make names both ways to get it.
      - id: go-lint
        name: golangci-lint
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: (^go\.mod$|^go\.sum$|\.go$)
        pass_filenames: false

      # Keeps flake.nix's vendorHash in step with the module set automatically. No-op without nix,
      # so non-nix users are never blocked by a hook they can't satisfy.
      - id: nix-vendor-hash
        name: nix vendorHash
        entry: bash -c 'command -v nix >/dev/null 2>&1 || exit 0; make nix-hash'
        language: system
        files: ^(go\.mod|go\.sum)$
        pass_filenames: false
