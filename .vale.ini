# Prose gate. Google's developer documentation style guide, as packaged by Vale, with this repo's
# deviations recorded below rather than rediscovered. `make docs-lint` runs it; `vale sync` fetches
# the package into .vale/, which is gitignored.
StylesPath = .vale
MinAlertLevel = warning
Packages = Google
Vocab = prettycov

# Two rules no linter checks, kept here because this is the file you open when it complains:
#
#   1. Every command block is real output from testdata/delegator-go126.out, the profile
#      golden_test.go pins. Run the command and paste what it printed. Mark an elision with "…",
#      and keep the lines above it consecutive.
#
#   2. Never copy output that something generates — help text, flag tables. It goes stale the
#      moment the source changes, and it did: a pasted --help listing was wrong within the hour.
#      Name the command instead.
#
# Structure follows Diátaxis (https://diataxis.fr): README pitches, docs/reference.md is reference
# and explanation, CHANGELOG says what broke. A README paragraph at home in the reference belongs
# in the reference.

[*.md]
BasedOnStyles = Vale, Google

# British spelling, throughout and deliberately: it is in the CLI's own help text, where "--color"
# takes "When to colour…", so American spelling here would disagree with the program's output.
Google.Spelling = NO

# The prose sets em dashes open, in Markdown and Go comments alike. Google sets them closed.
Google.EmDash = NO

# Google's voice is conversational and contracted. This prose is not, and neither are the CLI's
# messages, so contractions would read as a second author.
Google.Contractions = NO

# "CLI" is what this domain calls a CLI; "command-line tool" in a Go tool's docs is pedantry.
# Same rule wants "preceding" for "above", which is fine in a page read top to bottom.
Google.WordList = NO
Google.WordListCase = NO

# Capitalisation after a colon, which proper nouns break: "looser: VS Code's".
Google.Colons = NO

# The CHANGELOG quotes what a flag means from the reader's side — `--color=auto` is "decide for me".
Google.FirstPerson = NO

# Half its hits here are two-item lists it misreads ("covered or not"); the rest are in
# released CHANGELOG entries, which are a record rather than prose to re-edit.
Google.OxfordComma = NO
